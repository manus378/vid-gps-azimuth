<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태블릿 카메라 & 센서 데이터 레코더</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #4da6ff;
    }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 960px;
    }
    button {
      flex: 1;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-start {
      background-color: #28a745;
      color: white;
    }
    .btn-start:hover:not(:disabled) {
      background-color: #218838;
    }
    .btn-stop {
      background-color: #dc3545;
      color: white;
    }
    .btn-stop:hover:not(:disabled) {
      background-color: #c82333;
    }
    #status-bar {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>카메라 & 센서 데이터 레코더</h1>

  <div id="video-container">
    <canvas id="recordCanvas" width="1280" height="720"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start">녹화 & 데이터 수집 시작</button>
    <button id="stopBtn" class="btn-stop" disabled>녹화 중지 & 저장</button>
  </div>

  <div id="status-bar">상태: 카메라 및 센서 준비 중...</div>

  <!-- 비동기 오프스크린 비디오 태그 -->
  <video id="webcam" autoplay playsinline style="display:none;"></video>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('recordCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusBar = document.getElementById('status-bar');

    let currentGPS = { lat: 0, lng: 0, alt: 0, accuracy: 0 };
    let currentAzimuth = 0;
    let dataLogs = [];
    let isRecording = false;
    let mediaRecorder;
    let recordedChunks = [];

    // 1. 후면 카메라 초기화
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        statusBar.innerText = "상태: 후면 카메라 연결 완료";
      } catch (e) {
        console.warn("후면 카메라 전용 접근 실패, 기본 카메라로 대체합니다.", e);
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = fallbackStream;
          statusBar.innerText = "상태: 기본 카메라 연결 완료";
        } catch (err) {
          statusBar.innerText = "오류: 카메라 접근 권한이 거부되었거나 장치를 찾을 수 없습니다.";
        }
      }
    }

    // 2. GPS 데이터 추적
    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentGPS.lat = pos.coords.latitude;
            currentGPS.lng = pos.coords.longitude;
            currentGPS.alt = pos.coords.altitude || 0;
            currentGPS.accuracy = pos.coords.accuracy;
          },
          (err) => console.error("GPS 오차:", err),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        statusBar.innerText = "경고: 이 브라우저는 GPS 위치 서비스를 지원하지 않습니다.";
      }
    }

    // 3. 지자기/가속도 센서 퓨전 방위각 수신
    window.addEventListener("deviceorientation", (event) => {
      if (event.alpha !== null) {
        // 안드로이드 Chrome 기준: alpha(0~360°) 값을 자북/도북 기준 방위각으로 보정
        let heading = 360 - event.alpha;
        if (heading >= 360) heading -= 360;
        currentAzimuth = heading;
      }
    }, true);

    // 4. Canvas 실시간 오버레이 렌더링
    function renderFrame() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const now = new Date();
        const isoTimestamp = now.toISOString();

        // 좌측 상단 자막 배경 박스
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(15, 15, 600, 130);

        // 자막 텍스트
        ctx.fillStyle = "#00FF66"; // 형광 녹색
        ctx.font = "bold 22px monospace";
        ctx.fillText(`TIME    : ${isoTimestamp}`, 30, 45);
        ctx.fillText(`AZIMUTH : ${currentAzimuth.toFixed(1)}°`, 30, 75);
        ctx.fillText(`GPS     : ${currentGPS.lat.toFixed(6)}, ${currentGPS.lng.toFixed(6)} (±${currentGPS.accuracy.toFixed(1)}m)`, 30, 105);
        ctx.fillText(`ALTITUDE: ${currentGPS.alt.toFixed(1)}m`, 30, 130);

        // 녹화 중일 때 CSV 로그 데이터 누적 (30FPS 기반)
        if (isRecording) {
          dataLogs.push({
            timestamp: isoTimestamp,
            azimuth: currentAzimuth.toFixed(2),
            latitude: currentGPS.lat,
            longitude: currentGPS.lng,
            altitude: currentGPS.alt,
            accuracy: currentGPS.accuracy
          });
        }
      }
      requestAnimationFrame(renderFrame);
    }

    // 5. 녹화 제어
    startBtn.onclick = () => {
      dataLogs = [];
      recordedChunks = [];

      const stream = canvas.captureStream(30); // Canvas 화폭 기반 30 FPS 스트림 생성
      let options = { mimeType: 'video/webm;codecs=vp9' };
      
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = exportFiles;

      mediaRecorder.start();
      isRecording = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      statusBar.innerText = "상태: 녹화 및 센서 로그 수집 중...";
    };

    stopBtn.onclick = () => {
      isRecording = false;
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusBar.innerText = "상태: 파일 생성 및 다운로드 중...";
    };

    // 6. WebM 및 CSV 파일 출력 다운로드
    function exportFiles() {
      const fileTimestamp = new Date().toISOString().replace(/[:.]/g, "-");

      // 1) 동영상 저장
      const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
      downloadFile(videoBlob, `record_${fileTimestamp}.webm`);

      // 2) CSV 파일 생성 및 저장
      let csvContent = "Timestamp,Azimuth(deg),Latitude,Longitude,Altitude(m),Accuracy(m)\n";
      dataLogs.forEach(row => {
        csvContent += `${row.timestamp},${row.azimuth},${row.latitude},${row.longitude},${row.altitude},${row.accuracy}\n`;
      });
      
      const csvBlob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' }); // UTF-8 BOM 추가 (엑셀 한글 깨짐 방지)
      downloadFile(csvBlob, `sensor_log_${fileTimestamp}.csv`);

      statusBar.innerText = "상태: 동영상(.webm) 및 CSV 로그 다운로드 완료";
    }

    function downloadFile(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // 초기화 실행
    window.addEventListener('load', () => {
      initCamera();
      initGPS();
      renderFrame();
    });
  </script>
</body>
</html>
